<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AEROFIT - Neural Transformation</title>
    
    <!-- 1. โหลด Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 2. โหลด React Dependencies (เรียงลำดับสำคัญมาก) -->
    <!-- React Core -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Prop-types (Recharts บางเวอร์ชันต้องใช้) -->
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    
    <!-- Recharts (ใช้เวอร์ชัน 2.10.3 ที่เสถียรกับ CDN ที่สุด) -->
    <script src="https://unpkg.com/recharts@2.10.3/umd/Recharts.js"></script>
    
    <!-- Babel (ตัวแปลภาษา) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Kanit:wght@300;400;600&display=swap');
        
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #020617;
        }
        .font-display {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // --- 1. เตรียมไอคอน (ใช้ <g> แทน <> เพื่อความชัวร์) ---
        const Icon = ({ path, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {path}
            </svg>
        );

        const Brain = (props) => <Icon {...props} path={<g><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/></g>} />;
        const Dumbbell = (props) => <Icon {...props} path={<g><path d="m6.5 6.5 11 11"/><path d="m21 21-1-1"/><path d="m3 3 1 1"/><path d="m18 22 4-4"/><path d="m2 6 4-4"/><path d="m3 10 7-7"/><path d="m14 21 7-7"/></g>} />;
        const History = (props) => <Icon {...props} path={<g><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 12"/><path d="M3 3v9h9"/><path d="M12 7v5l4 2"/></g>} />;
        const Plus = (props) => <Icon {...props} path={<g><path d="M5 12h14"/><path d="M12 5v14"/></g>} />;
        const Moon = (props) => <Icon {...props} path={<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>} />;
        const Zap = (props) => <Icon {...props} path={<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>} />;
        const HeartPulse = (props) => <Icon {...props} path={<g><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/></g>} />;
        const Calendar = (props) => <Icon {...props} path={<g><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></g>} />;

        // --- 2. ดึง Library มาใช้ ---
        const { useState, useEffect, useMemo } = React;
        const { AreaChart, Area, Tooltip, ResponsiveContainer } = Recharts;

        // --- 3. ข้อมูลโปรแกรมฝึก ---
        const TRAINING_PROGRAM = {
            'Monday: Push': [
                { id: 'inc_p', name: 'Incline Machine Press', focus: 'อกบน', sets: 3, reps: '10-12', hint: 'เบาะ 30-45 องศา, ดันขึ้นช้าๆ ห้ามกลั้นหายใจ' },
                { id: 'flat_p', name: 'Dumbbell Flat Press', focus: 'อกรวม', sets: 3, reps: '10-12', hint: 'นอนราบ ดันดัมเบลขึ้นหากัน' },
                { id: 'lat_r', name: 'Lateral Raise', focus: 'ไหล่ข้าง', sets: 4, reps: '15', hint: 'กางแขนออกข้างลำตัว ล็อคศอกเล็กน้อย' },
                { id: 'tri_p', name: 'Triceps Pushdown', focus: 'หลังแขน', sets: 3, reps: '12', hint: 'ล็อคศอกข้างลำตัว กดเชือกลงให้สุด' }
            ],
            'Tuesday: Pull': [
                { id: 'lat_d', name: 'Lat Pulldown', focus: 'หลังกว้าง', sets: 3, reps: '10-12', hint: 'ดึงบาร์ลงมาหาอกส่วนบน หลังตรง' },
                { id: 'row', name: 'Seated Cable Row', focus: 'หลังหนา', sets: 3, reps: '10-12', hint: 'ดึงมือจับหาเอว บีบสะบักเข้าหากัน' },
                { id: 'curls', name: 'Bicep Curls', focus: 'แขนหน้า', sets: 3, reps: '12', hint: 'ยกดัมเบลขึ้น ไม่เหวี่ยงตัว' }
            ],
            'Wednesday: REST': [
                { id: 'rest_1', name: 'Recovery Walk', focus: 'หัวใจ', sets: 1, reps: '20 min', hint: 'เดินเล่นเบาๆ Zone 2' },
                { id: 'plank', name: 'Core Plank', focus: 'แกนกลาง', sets: 3, reps: '45s', hint: 'เกร็งหน้าท้อง หายใจลึกๆ' }
            ],
            'Thursday: Legs': [
                { id: 'leg_p', name: 'Leg Press', focus: 'ขา', sets: 3, reps: '12', hint: 'ห้ามกลั้นหายใจขณะดัน! พักนาน 3 นาที' },
                { id: 'ext', name: 'Leg Extension', focus: 'ขาหน้า', sets: 3, reps: '15', hint: 'เตะขาขึ้นให้สุด เกร็งค้าง 1 วิ' }
            ],
            'Friday: Details': [
                { id: 'inc_p2', name: 'Incline Press', focus: 'อกบน', sets: 3, reps: '12', hint: 'เน้นความคมชัด' },
                { id: 'row2', name: 'Cable Row', focus: 'หลังหนา', sets: 3, reps: '12', hint: 'บีบสะบักให้แน่น' }
            ],
            'Saturday: Light': [
                { id: 'walk', name: 'Light Cardio', focus: 'Cardio', sets: 1, reps: '30 min', hint: 'รักษาระดับการเต้นหัวใจให้คงที่' }
            ],
            'Sunday: REST': [
                { id: 'rest_2', name: 'Full Recovery', focus: 'Rest', sets: 0, reps: '0', hint: 'นอนหลับให้เพียงพอและทานอาหารที่มีประโยชน์' }
            ]
        };

        const DEFAULT_LOGS = [
            { n: 'Incline Machine Press', w: 10, r: 12, id: Date.now() - 172800000 },
            { n: 'Incline Machine Press', w: 12.5, r: 10, id: Date.now() - 86400000 }
        ];

        // --- 4. ตัวแอปหลัก (Main App Component) ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('home');
            const [phase, setPhase] = useState('1');
            const [logs, setLogs] = useState(DEFAULT_LOGS);
            const [currentDay, setCurrentDay] = useState(0);
            const [form, setForm] = useState({ ex: 'Incline Machine Press', w: '', r: '' });

            // Load Data
            useEffect(() => {
                setCurrentDay(new Date().getDay());
                try {
                    const savedPhase = localStorage.getItem('aerofit_phase');
                    const savedLogs = localStorage.getItem('aerofit_logs');
                    if (savedPhase) setPhase(savedPhase);
                    if (savedLogs) setLogs(JSON.parse(savedLogs));
                } catch (e) {
                    console.error('Error loading data', e);
                }
            }, []);

            // Save Data
            useEffect(() => {
                try {
                    localStorage.setItem('aerofit_logs', JSON.stringify(logs));
                    localStorage.setItem('aerofit_phase', phase);
                } catch (e) {
                    console.error('Storage error', e);
                }
            }, [logs, phase]);

            const aiInsight = useMemo(() => {
                if (currentDay === 0 || currentDay === 3) {
                    return {
                        status: 'Recovery Mode',
                        color: 'text-amber-400',
                        bg: 'bg-amber-400/10',
                        border: 'border-amber-400/20',
                        icon: <Moon className="w-4 h-4 text-amber-400" />,
                        text: 'วันนี้เป็นวันพักของคุณ! ร่างกายต้องการการซ่อมแซมเพื่อสร้างกล้ามเนื้อ เน้นทานโปรตีนและโฟเลตให้เพียงพอครับ'
                    };
                }

                if (logs.length < 3) {
                    return {
                        status: 'Learning Mode',
                        color: 'text-cyan-400',
                        bg: 'bg-cyan-400/10',
                        border: 'border-cyan-400/20',
                        icon: <Brain className="w-4 h-4 text-cyan-400" />,
                        text: `กำลังวิเคราะห์ข้อมูล... Phase ${phase}: เน้นจัดท่าทาง (Tempo) ให้เป๊ะก่อนเพิ่มน้ำหนัก`
                    };
                }

                const last = logs[logs.length - 1];
                const prev = logs[logs.length - 2];

                if (last.w > prev.w) {
                    return {
                        status: 'Growth Detected',
                        color: 'text-emerald-400',
                        bg: 'bg-emerald-400/10',
                        border: 'border-emerald-400/20',
                        icon: <Zap className="w-4 h-4 text-emerald-400" />,
                        text: 'Progressive Overload สำเร็จ! ร่างกายของคุณพัฒนาขึ้นอย่างเห็นได้ชัด รักษาความต่อเนื่องไว้ครับ'
                    };
                }

                if (last.w < prev.w * 0.9) {
                    return {
                        status: 'Fatigue Alert',
                        color: 'text-rose-400',
                        bg: 'bg-rose-400/10',
                        border: 'border-rose-400/20',
                        icon: <HeartPulse className="w-4 h-4 text-rose-400" />,
                        text: 'ตรวจพบความล้าสะสม! แรงตกลงเกิน 10% แนะนำให้ลดน้ำหนักที่ยกลง 15% หรือพักเพิ่ม 1 วันครับ'
                    };
                }

                return {
                    status: 'Steady Path',
                    color: 'text-cyan-400',
                    bg: 'bg-cyan-400/10',
                    border: 'border-cyan-400/20',
                    icon: <Brain className="w-4 h-4 text-cyan-400" />,
                    text: phase === '1' ? 'เน้นจังหวะลง 3 วินาที ดันขึ้น 1 วินาที' : 'รักษาระดับการเล่นได้ดี พร้อมสำหรับความท้าทายใหม่'
                };
            }, [logs, phase, currentDay]);

            const totalVolume = logs.reduce((acc, curr) => acc + (curr.w * curr.r), 0);

            const handleSave = () => {
                if (!form.w || !form.r) return;
                const newLog = {
                    n: form.ex,
                    w: parseFloat(form.w),
                    r: parseInt(form.r),
                    id: Date.now()
                };
                setLogs([...logs, newLog]);
                setForm({ ...form, w: '', r: '' });
                setActiveTab('home');
            };

            return (
                <div className="min-h-screen text-slate-100 pb-24 select-none">
                    <div className="max-w-md mx-auto p-5">
                        
                        {/* Header */}
                        <header className="flex justify-between items-end mb-6">
                            <div>
                                <h1 className="text-2xl font-black tracking-tighter italic uppercase text-white font-display">
                                    AERO<span className="text-cyan-400">FIT</span>
                                </h1>
                                <p className="text-[9px] font-bold text-cyan-500/60 tracking-[0.3em] uppercase">90-Day Neural Transformation</p>
                            </div>
                            <select 
                                value={phase} 
                                onChange={(e) => setPhase(e.target.value)}
                                className="bg-slate-900 text-[10px] font-bold text-cyan-400 px-3 py-1.5 rounded-full border border-cyan-500/20 outline-none focus:ring-1 focus:ring-cyan-500"
                            >
                                <option value="1">Phase 1: Tempo</option>
                                <option value="2">Phase 2: Volume</option>
                                <option value="3">Phase 3: Intensity</option>
                            </select>
                        </header>

                        {/* Stats Grid */}
                        <div className="grid grid-cols-3 gap-2 mb-6 text-center font-bold">
                            <div className="bg-slate-900/50 border border-white/5 rounded-2xl p-3">
                                <p className="text-[8px] text-slate-500 uppercase">Day</p>
                                <p className="text-sm text-white">1/90</p>
                            </div>
                            <div className="bg-slate-900/50 border border-white/5 rounded-2xl p-3">
                                <p className="text-[8px] text-slate-500 uppercase tracking-tighter font-bold">Target</p>
                                <p className="text-sm text-cyan-400 uppercase">Bulk</p>
                            </div>
                            <div className="bg-slate-900/50 border border-white/5 rounded-2xl p-3">
                                <p className="text-[8px] text-slate-500 uppercase">Health</p>
                                <p className="text-[9px] text-rose-400 uppercase">Thal-Guard</p>
                            </div>
                        </div>

                        {/* AI Insight */}
                        <div className={`p-4 rounded-3xl border ${aiInsight.border} ${aiInsight.bg} mb-6 transition-all duration-500 shadow-lg shadow-cyan-900/5`}>
                            <div className="flex items-center justify-between mb-2">
                                <div className="flex items-center gap-2">
                                    {aiInsight.icon}
                                    <span className={`text-[10px] font-black uppercase tracking-widest ${aiInsight.color}`}>{aiInsight.status}</span>
                                </div>
                                <div className="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-pulse"></div>
                            </div>
                            <p className="text-[11px] text-slate-300 leading-relaxed font-medium italic">
                                "{aiInsight.text}"
                            </p>
                        </div>

                        {/* Content Tabs */}
                        {activeTab === 'home' && (
                            <div className="space-y-6 animate-in fade-in duration-500">
                                <div className="bg-slate-900/40 border border-white/5 p-6 rounded-[32px] text-center relative overflow-hidden">
                                    <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-cyan-500/50 to-transparent"></div>
                                    <p className="text-[10px] text-slate-500 uppercase tracking-widest mb-1 font-bold">Total Accumulated Power</p>
                                    <p className="text-4xl font-black text-white italic font-display">
                                        {totalVolume.toLocaleString()}<span className="text-xs text-cyan-500 ml-1 not-italic font-bold tracking-normal uppercase">kg</span>
                                    </p>
                                </div>

                                <div className="h-44 w-full bg-slate-900/20 rounded-3xl p-2 border border-white/5">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <AreaChart data={logs.slice(-7)}>
                                            <defs>
                                                <linearGradient id="colorVol" x1="0" y1="0" x2="0" y2="1">
                                                    <stop offset="5%" stopColor="#22d3ee" stopOpacity={0.3}/>
                                                    <stop offset="95%" stopColor="#22d3ee" stopOpacity={0}/>
                                                </linearGradient>
                                            </defs>
                                            <Tooltip 
                                                contentStyle={{ backgroundColor: '#0f172a', border: '1px solid #334155', borderRadius: '12px' }}
                                                itemStyle={{ color: '#22d3ee', fontSize: '12px' }}
                                                labelStyle={{ display: 'none' }}
                                            />
                                            <Area type="monotone" dataKey={(d) => d.w * d.r} stroke="#22d3ee" strokeWidth={3} fillOpacity={1} fill="url(#colorVol)" />
                                        </AreaChart>
                                    </ResponsiveContainer>
                                </div>

                                <div className="space-y-3">
                                    <h3 className="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] px-2">Recent History</h3>
                                    {logs.slice(-5).reverse().map((log) => (
                                        <div key={log.id} className="bg-slate-900/60 border border-white/5 p-4 rounded-2xl flex justify-between items-center hover:bg-slate-900 transition-colors">
                                            <div className="flex items-center gap-3">
                                                <div className="w-8 h-8 rounded-lg bg-cyan-500/10 flex items-center justify-center">
                                                    <Zap className="w-4 h-4 text-cyan-500" />
                                                </div>
                                                <div>
                                                    <p className="text-xs font-bold text-white line-clamp-1">{log.n}</p>
                                                    <p className="text-[8px] text-slate-500 uppercase font-bold">{new Date(log.id).toLocaleDateString('th-TH')}</p>
                                                </div>
                                            </div>
                                            <div className="text-right min-w-[80px]">
                                                <p className="text-sm font-black text-cyan-400 italic">{log.w}kg <span className="text-white opacity-50 text-[10px] mx-1">x</span> {log.r}</p>
                                                <p className="text-[8px] text-slate-600 font-bold uppercase">Vol: {(log.w * log.r).toFixed(0)}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'log' && (
                            <div className="bg-slate-900/60 border border-white/10 p-8 rounded-[40px] space-y-6 animate-in slide-in-from-bottom-6 duration-500 shadow-2xl shadow-black">
                                <h2 className="text-center font-black text-xl text-white uppercase italic tracking-tighter font-display">Record Session</h2>
                                
                                <div className="space-y-4">
                                    <div>
                                        <label className="text-[9px] font-black text-slate-500 uppercase mb-2 block tracking-widest">Select Exercise</label>
                                        <select 
                                            value={form.ex}
                                            onChange={(e) => setForm({...form, ex: e.target.value})}
                                            className="w-full bg-slate-800 p-4 rounded-2xl text-sm font-bold border-none outline-none ring-1 ring-white/5 focus:ring-cyan-500 text-white appearance-none"
                                        >
                                            {Object.keys(TRAINING_PROGRAM).map(day => (
                                                <optgroup key={day} label={day} className="bg-slate-900 text-slate-400">
                                                    {TRAINING_PROGRAM[day].map(e => (
                                                        <option key={e.id} value={e.name} className="text-white">{e.name}</option>
                                                    ))}
                                                </optgroup>
                                            ))}
                                        </select>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-[9px] font-black text-slate-500 uppercase mb-2 block tracking-widest">Weight (KG)</label>
                                            <input 
                                                type="number" 
                                                value={form.w}
                                                onChange={(e) => setForm({...form, w: e.target.value})}
                                                placeholder="0.0" 
                                                className="w-full bg-slate-800 p-4 rounded-2xl text-xl font-black text-cyan-400 outline-none ring-1 ring-white/5 focus:ring-cyan-500 text-center"
                                            />
                                        </div>
                                        <div>
                                            <label className="text-[9px] font-black text-slate-500 uppercase mb-2 block tracking-widest">Reps</label>
                                            <input 
                                                type="number" 
                                                value={form.r}
                                                onChange={(e) => setForm({...form, r: e.target.value})}
                                                placeholder="0" 
                                                className="w-full bg-slate-800 p-4 rounded-2xl text-xl font-black text-white outline-none ring-1 ring-white/5 focus:ring-cyan-500 text-center"
                                            />
                                        </div>
                                    </div>

                                    <button 
                                        onClick={handleSave}
                                        disabled={!form.w || !form.r}
                                        className="w-full bg-cyan-500 hover:bg-cyan-400 disabled:opacity-50 disabled:cursor-not-allowed py-5 rounded-3xl text-slate-950 font-black text-xs uppercase tracking-[0.2em] shadow-xl shadow-cyan-500/20 active:scale-95 transition-all font-display"
                                    >
                                        Sync to Neural Link
                                    </button>
                                </div>
                            </div>
                        )}

                        {activeTab === 'guide' && (
                            <div className="space-y-6 animate-in fade-in duration-500">
                                <h2 className="text-center font-black text-sm text-white uppercase tracking-widest mb-4 font-display">90-Day Bio-Lab Manual</h2>
                                {Object.keys(TRAINING_PROGRAM).map(day => (
                                    <div key={day} className="space-y-3">
                                        <div className="flex items-center gap-2 px-2">
                                            <Calendar className="w-3 h-3 text-cyan-500" />
                                            <h3 className="text-[10px] font-black text-cyan-500 uppercase tracking-widest">{day}</h3>
                                        </div>
                                        {TRAINING_PROGRAM[day].map(e => (
                                            <div key={e.id} className="bg-slate-900/40 border-l-4 border-cyan-500/30 p-5 rounded-2xl group hover:border-cyan-500 transition-all hover:bg-slate-900/60">
                                                <div className="flex justify-between items-start mb-2">
                                                    <p className="font-bold text-white text-xs">{e.name}</p>
                                                    {e.sets > 0 && (
                                                        <span className="bg-cyan-500/10 text-cyan-400 text-[8px] px-2 py-0.5 rounded font-black uppercase">
                                                            {e.sets}x{e.reps}
                                                        </span>
                                                    )}
                                                </div>
                                                <p className="text-[10px] text-slate-400 leading-relaxed italic">"{e.hint}"</p>
                                            </div>
                                        ))}
                                    </div>
                                ))}
                            </div>
                        )}

                    </div>

                    {/* Navigation Bar */}
                    <nav className="fixed bottom-0 left-0 right-0 bg-slate-950/80 backdrop-blur-xl border-t border-white/5 h-20 flex justify-around items-center max-w-md mx-auto z-50">
                        <button 
                            onClick={() => setActiveTab('home')}
                            className={`flex flex-col items-center gap-1 transition-all ${activeTab === 'home' ? 'text-cyan-400 scale-110' : 'text-slate-500 hover:text-slate-300'}`}
                        >
                            <History className="w-5 h-5" />
                            <span className="text-[8px] font-black uppercase">Stats</span>
                        </button>

                        <button 
                            onClick={() => setActiveTab('log')}
                            className="w-14 h-14 bg-cyan-500 rounded-2xl -mt-10 flex items-center justify-center text-slate-950 shadow-xl shadow-cyan-500/20 active:scale-90 transition-all ring-4 ring-slate-950"
                        >
                            <Plus className="w-6 h-6 stroke-[3px]" />
                        </button>

                        <button 
                            onClick={() => setActiveTab('guide')}
                            className={`flex flex-col items-center gap-1 transition-all ${activeTab === 'guide' ? 'text-cyan-400 scale-110' : 'text-slate-500 hover:text-slate-300'}`}
                        >
                            <Dumbbell className="w-5 h-5" />
                            <span className="text-[8px] font-black uppercase">Manual</span>
                        </button>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
