<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>90-Day Strict Workout Tracker with AI Analysis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body {
            background-color: #0f172a;
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
        }
        .day-card {
            background-color: #1e293b;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .day-card.completed {
            border-left: 8px solid #22c55e;
            opacity: 0.9;
        }
        .day-card.rest {
            background-color: #111827;
            border-left: 8px solid #64748b;
        }
        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 50;
            background-color: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #334155;
        }
        .coach-tip {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 4px;
            display: block;
            border-left: 2px solid #3b82f6;
            padding-left: 8px;
        }
        .ai-glow {
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.2);
            border: 1px solid rgba(168, 85, 247, 0.4);
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <header class="sticky-header mb-8 pb-4">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-3xl font-black text-blue-500 pt-4 text-center">🛡️ 90-DAY STRICT PROGRAM</h1>
            <p class="text-slate-400 text-center mb-6">วินัยคือจุดเริ่มต้นของความสำเร็จ</p>
            
            <!-- AI Analysis Dashboard -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div class="ai-glow bg-slate-900 p-4 rounded-2xl">
                    <div class="flex items-center gap-2 mb-2">
                        <span class="text-purple-400 text-xl">🧠</span>
                        <h2 class="text-xs font-bold uppercase tracking-widest text-purple-400">AI Status Analysis</h2>
                    </div>
                    <p id="ai-status" class="text-sm text-slate-300 font-medium italic">กำลังวิเคราะห์พฤติกรรมการฝึก...</p>
                </div>
                
                <div class="bg-slate-800/50 p-4 rounded-2xl border border-slate-700">
                    <span class="text-xs uppercase tracking-wider block text-slate-400 mb-1">Workout Progress</span>
                    <div class="flex items-end gap-2">
                        <span id="progress-percent" class="text-3xl font-black text-green-400 leading-none">0%</span>
                        <span id="completed-count" class="text-sm text-slate-500 pb-1">0/39 days</span>
                    </div>
                </div>

                <div class="bg-slate-800/50 p-4 rounded-2xl border border-slate-700">
                    <span class="text-xs uppercase tracking-wider block text-slate-400 mb-1">Body Recovery</span>
                    <div class="w-full bg-slate-700 h-2 rounded-full mt-2">
                        <div id="recovery-bar" class="bg-blue-500 h-2 rounded-full transition-all duration-1000" style="width: 100%"></div>
                    </div>
                    <span id="recovery-text" class="text-[10px] text-blue-300 mt-1 block">Optimal - พร้อมสำหรับการฝึก</span>
                </div>
            </div>
        </div>
    </header>

    <div id="calendar-container" class="max-w-4xl mx-auto space-y-6">
        <!-- Generated by JS -->
    </div>

    <script>
        const workoutPlan = {
            "อังคาร": {
                title: "พละกำลังส่วนบนและขา (Heavy Push & Legs)",
                focus: "Strength",
                exercises: [
                    { name: "Warm-up: เดินลู่วิ่ง 5 นาที", tip: "ความเร็ว 5.0-5.5 ไม่จับราว แกว่งแขนตามธรรมชาติ" },
                    { name: "Chest Press Machine: 4 เซต / 10-12 ครั้ง", tip: "หลังชิดเบาะ ดันออกหายใจออก (ระเบิดพลัง) ผ่อนเข้าหายใจเข้า (ช้าๆ)" },
                    { name: "Dumbbell Goblet Squats: 4 เซต / 12-15 ครั้ง", tip: "ถือดัมเบลชิดอก ทิ้งก้นลงเหมือนนั่งเก้าอี้ อย่าให้เข่าเลยปลายเท้ามากไป" },
                    { name: "Dumbbell Shoulder Press: 3 เซต / 10 ครั้ง", tip: "นั่งหลังตรง ยกเป้าหมายคือให้แขนตึงพอดี ไม่กระชากไหล่" },
                    { name: "Plank: 3 รอบ / รอบละ 60 วินาที", tip: "เกร็งหน้าท้องและก้น ตัวต้องขนานพื้นเหมือนไม้กระดาน" }
                ]
            },
            "พฤหัสบดี": {
                title: "ความอึดและการเผาผลาญ (Cardio Focus)",
                focus: "Endurance",
                exercises: [
                    { name: "Treadmill Incline Walk: 30 นาที", tip: "ชัน 5-8% / เร็ว 4.5-5.5 ห้ามจับราวเด็ดขาด เพื่อการเผาผลาญสูงสุด" },
                    { name: "Dumbbell Row: 4 เซต / 12 ครั้ง (ทีละข้าง)", tip: "โน้มตัวลง หลังตรง ดึงดัมเบลเข้าหาเอว (ไม่ใช่ดึงขึ้นหน้าอก) เน้นใช้กล้ามหลัง" },
                    { name: "Dumbbell Lunges: 3 เซต / ข้างละ 10 ครั้ง", tip: "ก้าวไปข้างหน้า ย่อเข่าทำมุม 90 องศาทั้งสองข้าง รักษาตัวให้ตรง" },
                    { name: "Dumbbell Lateral Raise: 3 เซต / 12 ครั้ง", tip: "ยกดัมเบลออกด้านข้างเพียงระดับไหล่ อย่าเหวี่ยง ใช้แรงจากหัวไหล่เพียวๆ" }
                ]
            },
            "เสาร์": {
                title: "ฝึกรวมและเก็บรายละเอียด (Full Body & Intensity)",
                focus: "Intensity",
                exercises: [
                    { name: "Warm-up: วิ่งลู่วิ่ง 5 นาที", tip: "ความเร็ว 7.0-8.0 เพื่อให้ร่างกายพร้อมรับงานหนัก" },
                    { name: "Chest Press Machine: 3 เซต / 15 ครั้ง", tip: "เน้นการบีบกล้ามเนื้ออกในทุกครั้งที่ดันจนสุด" },
                    { name: "Dumbbell Romanian Deadlift: 3 เซต / 12 ครั้ง", tip: "ดันสะโพกไปด้านหลัง ก้มลงโดยขาเกือบตึง จะรู้สึกตึงมากที่หลังขา" },
                    { name: "Dumbbell Bicep Curls: 3 เซต / 12 ครั้ง", tip: "ล็อกศอกข้างลำตัว อย่าเหวี่ยงตัวช่วยยก" },
                    { name: "Dumbbell Tricep Extension: 3 เซต / 12 ครั้ง", tip: "ถือดัมเบลยกเหนือหัว พับศอกไปด้านหลัง ล็อกต้นแขนให้นิ่ง" },
                    { name: "Treadmill HIIT: วิ่ง 1 นาที / เดิน 1 นาที (5 รอบ)", tip: "วิ่งเต็มสปีด (9.0+) แล้วกลับมาเดินช้า (3.0) สลับกัน" }
                ]
            }
        };

        const daysOfWeek = ["อาทิตย์", "จันทร์", "อังคาร", "พุธ", "พฤหัสบดี", "ศุกร์", "เสาร์"];
        const startDate = new Date();
        const totalDays = 90;
        let completedDays = JSON.parse(localStorage.getItem('completedWorkouts') || "[]");

        function renderCalendar() {
            const container = document.getElementById('calendar-container');
            container.innerHTML = '';
            let totalWorkoutDays = 0;

            for (let i = 0; i < totalDays; i++) {
                const currentDate = new Date(startDate);
                currentDate.setDate(startDate.getDate() + i);
                const dayName = daysOfWeek[currentDate.getDay()];
                const plan = workoutPlan[dayName];
                const dateString = currentDate.toLocaleDateString('th-TH', { day: 'numeric', month: 'short' });
                
                const card = document.createElement('div');
                card.className = `day-card p-6 rounded-2xl shadow-xl ${completedDays.includes(i) ? 'completed' : ''}`;
                
                if (plan) {
                    totalWorkoutDays++;
                    card.innerHTML = `
                        <div class="flex flex-col md:flex-row justify-between md:items-center gap-4 mb-4">
                            <div>
                                <span class="bg-blue-600/30 text-blue-400 text-xs font-bold px-2 py-1 rounded uppercase mb-2 inline-block">Day ${i + 1} - ${dayName}</span>
                                <h3 class="text-xl font-bold text-white">${plan.title}</h3>
                                <p class="text-slate-500 text-sm">${dateString}</p>
                            </div>
                            <button onclick="toggleDay(${i})" class="w-full md:w-auto px-6 py-3 rounded-xl font-bold transition-all ${completedDays.includes(i) ? 'bg-green-600 hover:bg-green-700 shadow-lg shadow-green-900/20' : 'bg-blue-600 hover:bg-blue-700 active:scale-95 shadow-lg shadow-blue-900/20'}">
                                ${completedDays.includes(i) ? '✓ COMPLETED' : 'MARK DONE'}
                            </button>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            ${plan.exercises.map(ex => `
                                <div class="bg-slate-900/50 p-3 rounded-lg border border-slate-800">
                                    <span class="font-medium text-slate-200 block">${ex.name}</span>
                                    <span class="coach-tip text-slate-400">💡 Tip: ${ex.tip}</span>
                                </div>
                            `).join('')}
                        </div>
                    `;
                } else {
                    card.classList.add('rest');
                    card.innerHTML = `
                        <div class="flex items-center gap-4 text-slate-500 italic font-medium">
                            <span class="text-sm">DAY ${i + 1} - ${dayName} (${dateString})</span>
                            <span class="h-[1px] flex-grow bg-slate-800"></span>
                            <span class="text-sm">RECOVERY DAY 💤</span>
                        </div>
                    `;
                }
                container.appendChild(card);
            }
            updateStats(totalWorkoutDays);
            runAIAnalysis(totalWorkoutDays);
        }

        function runAIAnalysis(totalWorkoutDays) {
            const aiStatus = document.getElementById('ai-status');
            const recoveryBar = document.getElementById('recovery-bar');
            const recoveryText = document.getElementById('recovery-text');
            
            const doneCount = completedDays.length;
            const completionRate = (doneCount / totalWorkoutDays) * 100;

            // Simple AI Heuristic for Status
            if (doneCount === 0) {
                aiStatus.innerText = "เตรียมความพร้อม! ระบบ AI พร้อมติดตามผลการฝึกของคุณตั้งแต่วันแรก";
                recoveryBar.style.width = "100%";
            } else if (completionRate > 90) {
                aiStatus.innerText = "ยอดเยี่ยม! วินัยของคุณอยู่ในเกณฑ์สูงมาก กล้ามเนื้อกำลังพัฒนาอย่างเต็มที่";
                recoveryBar.style.width = "85%";
                recoveryText.innerText = "Stable - ร่างกายกำลังปรับตัวได้ดี";
            } else if (completionRate > 50) {
                aiStatus.innerText = "เริ่มเห็นผลลัพธ์! พยายามรักษาความต่อเนื่องต่อไปเพื่อเปลี่ยนสรีระอย่างถาวร";
                recoveryBar.style.width = "70%";
                recoveryText.innerText = "Active - ต้องการการพักผ่อนที่มีคุณภาพ";
            } else {
                aiStatus.innerText = "คำเตือน: วินัยเริ่มลดลง หากขาดการฝึกบ่อยเกินไป ผลลัพธ์ที่สร้างมาจะสูญเปล่า";
                recoveryBar.style.width = "95%";
                recoveryText.innerText = "Caution - ร่างกายยังไม่ได้รับการกระตุ้นที่เพียงพอ";
            }

            // AI Suggestion based on the last workout day
            if (completedDays.length > 0) {
                const lastDayIdx = Math.max(...completedDays);
                const today = new Date();
                const start = new Date(startDate);
                const dayDiff = Math.floor((today - start) / (1000 * 60 * 60 * 24));
                
                if (dayDiff - lastDayIdx > 3) {
                    aiStatus.innerHTML = "<span class='text-red-400'>คุณขาดการติดต่อนานเกินไป!</span> กลับมาฝึกเดี๋ยวนี้เพื่อรักษาระดับฮอร์โมน";
                }
            }
        }

        function toggleDay(index) {
            const idx = completedDays.indexOf(index);
            if (idx > -1) completedDays.splice(idx, 1);
            else completedDays.push(index);
            localStorage.setItem('completedWorkouts', JSON.stringify(completedDays));
            renderCalendar();
        }

        function updateStats(totalWorkoutDays) {
            const actualWorkoutsDone = completedDays.length; 
            const percent = totalWorkoutDays > 0 ? Math.round((actualWorkoutsDone / totalWorkoutDays) * 100) : 0;
            document.getElementById('progress-percent').innerText = `${percent}%`;
            document.getElementById('completed-count').innerText = `${actualWorkoutsDone}/${totalWorkoutDays}`;
        }

        renderCalendar();
    </script>
</body>
</html>
