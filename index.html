<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aerofit 90-Day Transformation</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Kanit:wght@300;400;600;800&display=swap');
        body { font-family: 'Kanit', sans-serif; background: #020617; color: #f8fafc; margin: 0; }
        .font-brand { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; }
        .ai-border { border: 1px solid rgba(34, 211, 238, 0.3); box-shadow: 0 0 15px rgba(34, 211, 238, 0.1); }
        .phase-badge { background: linear-gradient(90deg, #22d3ee, #0891b2); color: #020617; }
    </style>
</head>
<body class="pb-28">
    <div class="max-w-md mx-auto p-6 min-h-screen">
        <!-- Header & Phase Control -->
        <header class="mb-6">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h1 class="text-2xl font-brand font-black italic text-white uppercase leading-none">Aero<span class="text-cyan-400">fit</span></h1>
                    <p class="text-[8px] text-cyan-500/60 font-brand tracking-[0.3em]">90-DAY TRANSFORMATION</p>
                </div>
                <select id="current-phase" onchange="updatePhase()" class="bg-slate-800 text-[10px] font-bold text-cyan-400 px-3 py-1 rounded-full border border-cyan-500/30 outline-none">
                    <option value="1">Phase 1: Tempo</option>
                    <option value="2">Phase 2: Volume</option>
                    <option value="3">Phase 3: Intensity</option>
                </select>
            </div>
            
            <!-- Stats Summary -->
            <div class="grid grid-cols-3 gap-2">
                <div class="glass p-3 text-center border-b-2 border-cyan-500/50">
                    <p class="text-[8px] text-slate-500 uppercase font-bold">Day</p>
                    <p id="stat-days" class="text-sm font-brand text-white">1/90</p>
                </div>
                <div class="glass p-3 text-center">
                    <p class="text-[8px] text-slate-500 uppercase font-bold">Target</p>
                    <p class="text-sm font-brand text-cyan-400 uppercase">Bulk</p>
                </div>
                <div class="glass p-3 text-center">
                    <p class="text-[8px] text-slate-500 uppercase font-bold">Health</p>
                    <p class="text-[9px] font-bold text-rose-400 uppercase">Thal-Guard</p>
                </div>
            </div>
        </header>

        <!-- AI Neural Insight -->
        <div id="ai-insight" class="glass ai-border p-5 mb-6">
            <div class="flex items-center justify-between mb-2">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-brain text-cyan-400 text-xs"></i>
                    <span class="text-[10px] font-brand font-bold text-cyan-400 uppercase tracking-widest">Neural Advisor</span>
                </div>
                <span id="ai-mode" class="text-[8px] font-bold bg-white/5 px-2 py-0.5 rounded text-slate-400 uppercase tracking-tighter">Analyzing...</span>
            </div>
            <p id="ai-suggestion" class="text-[11px] text-slate-300 leading-relaxed italic">ยินดีต้อนรับสู่โปรแกรม 90 วัน เริ่มบันทึกการฝึกเพื่อรับคำแนะนำจาก AI</p>
        </div>

        <!-- Dynamic Content -->
        <div id="content" class="space-y-6"></div>
    </div>

    <!-- Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-950/90 backdrop-blur-xl border-t border-white/5 h-20 flex justify-around items-center max-w-md mx-auto z-50">
        <button onclick="showPage('home')" id="nav-home" class="flex flex-col items-center text-cyan-400"><i class="fa-solid fa-house-chimney-window"></i><span class="text-[9px] mt-1 uppercase font-bold">Dash</span></button>
        <button onclick="showPage('log')" id="nav-log" class="w-14 h-14 bg-cyan-500 rounded-2xl -mt-10 flex items-center justify-center text-slate-950 shadow-xl shadow-cyan-500/20 active:scale-90 transition-transform"><i class="fa-solid fa-plus text-xl"></i></button>
        <button onclick="showPage('guide')" id="nav-guide" class="flex flex-col items-center text-slate-500"><i class="fa-solid fa-dumbbell"></i><span class="text-[9px] mt-1 uppercase font-bold">Program</span></button>
    </nav>

    <script>
        const TRAINING_PROGRAM = {
            'Push': [
                { id: 'inc_p', name: 'Incline Machine Press', focus: 'อกบน', sets: 3, reps: '10-12', hint: 'เบาะ 30-45 องศา, ดันขึ้นช้าๆ ห้ามกลั้นหายใจ' },
                { id: 'flat_p', name: 'Dumbbell Flat Press', focus: 'อกรวม', sets: 3, reps: '10-12', hint: 'นอนราบ ดันดัมเบลขึ้นหากัน' },
                { id: 'lat_r', name: 'Lateral Raise', focus: 'ไหล่ข้าง', sets: 4, reps: '15', hint: 'กางแขนออกข้างลำตัว ล็อคศอกเล็กน้อย' },
                { id: 'tri_p', name: 'Triceps Pushdown', focus: 'หลังแขน', sets: 3, reps: '12', hint: 'ล็อคศอกข้างลำตัว กดเชือกลงให้สุด' }
            ],
            'Pull': [
                { id: 'lat_d', name: 'Lat Pulldown', focus: 'หลังกว้าง', sets: 3, reps: '10-12', hint: 'ดึงบาร์ลงมาหาอกส่วนบน หลังตรง' },
                { id: 'row', name: 'Seated Cable Row', focus: 'หลังหนา', sets: 3, reps: '10-12', hint: 'ดึงมือจับหาเอว บีบสะบักเข้าหากัน' },
                { id: 'curls', name: 'Bicep Curls', focus: 'แขนหน้า', sets: 3, reps: '12', hint: 'ยกดัมเบลขึ้น ไม่เหวี่ยงตัว' }
            ],
            'Legs': [
                { id: 'leg_p', name: 'Leg Press', focus: 'ขา', sets: 3, reps: '12', hint: 'ดันเครื่องออกไป ระวังอย่าล็อคเข่าตึง' },
                { id: 'plank', name: 'Core Plank', focus: 'แกนกลาง', sets: 3, reps: '45s', hint: 'เกร็งหน้าท้อง หายใจลึกๆ ห้ามกลั้นหายใจ' }
            ]
        };

        let logs = JSON.parse(localStorage.getItem('logs')) || [];
        let currentPhase = localStorage.getItem('phase') || "1";

        function updatePhase() {
            currentPhase = document.getElementById('current-phase').value;
            localStorage.setItem('phase', currentPhase);
            runAIAnalysis();
        }

        function runAIAnalysis() {
            const sug = document.getElementById('ai-suggestion');
            const mode = document.getElementById('ai-mode');
            const status = document.getElementById('status-chip');
            
            document.getElementById('current-phase').value = currentPhase;

            let phaseText = "";
            if(currentPhase === "1") phaseText = "Phase 1: เน้นจังหวะ Tempo (ลง 3วิ / ขึ้น 1วิ) ห้ามยกหนักเกินไป โฟกัสการหายใจ";
            if(currentPhase === "2") phaseText = "Phase 2: เพิ่มความจุ (Volume) หากยกได้ครบเซตแล้ว ให้เพิ่มน้ำหนัก 2.5kg ทันที";
            if(currentPhase === "3") phaseText = "Phase 3: ความเข้มข้นสูง (Intensity) ลดครั้งลงเป็น 6-8 ครั้ง แต่เน้นน้ำหนักให้หนักขึ้น";

            if (logs.length < 3) {
                sug.innerHTML = `<span class="text-cyan-400">คำแนะนำจากระยะที่ ${currentPhase}:</span> ${phaseText}`;
                mode.innerText = "Learning Mode";
                return;
            }

            const last = logs[logs.length-1];
            const prev = logs[logs.length-2];
            
            if (last.w > prev.w) {
                sug.innerHTML = "🔥 <span class='text-cyan-400'>Progressive Overload Detected!</span> ร่างกายพัฒนาได้ดีมาก รักษาระดับโปรตีนให้ถึง 1.6-2g/kg";
                mode.innerText = "Growth Detected";
            } else if (last.w < prev.w * 0.9) {
                sug.innerHTML = "⚠️ <span class='text-rose-400'>Fatigue Detected:</span> แรงตกลงเกิน 10% แนะนำให้พักเพิ่ม 1 วัน หรือเดินเบาๆ แทนการยกเวท";
                mode.innerText = "Recovery Alert";
            } else {
                sug.innerHTML = phaseText;
                mode.innerText = "Steady Path";
            }
        }

        function showPage(page) {
            const div = document.getElementById('content');
            div.innerHTML = '';
            
            // Nav UI
            document.querySelectorAll('nav button').forEach(b => b.classList.replace('text-cyan-400', 'text-slate-500'));
            if(page !== 'log') document.getElementById('nav-'+page).classList.replace('text-slate-500', 'text-cyan-400');

            if(page === 'home') {
                const vol = logs.reduce((a,b)=>a+(b.w*b.r), 0);
                div.innerHTML = `
                    <div class="glass p-6 text-center">
                        <p class="text-[9px] text-slate-500 uppercase font-bold tracking-[0.2em] mb-1">Total Accumulated Volume</p>
                        <p class="text-3xl font-brand font-black text-white">${vol.toLocaleString()} <span class="text-xs text-cyan-500">KG</span></p>
                    </div>
                    <canvas id="chart" class="h-40 glass p-2"></canvas>
                    <div class="space-y-3">
                        <h3 class="text-[10px] font-bold text-slate-500 uppercase px-2 tracking-widest">Recent Activity</h3>
                        ${logs.slice(-5).reverse().map(l => `
                            <div class="glass p-4 flex justify-between items-center">
                                <div>
                                    <p class="text-xs font-bold text-white">${l.n}</p>
                                    <p class="text-[8px] text-slate-500 uppercase">${new Date(l.id).toLocaleDateString('th-TH')}</p>
                                </div>
                                <div class="text-right">
                                    <p class="text-xs font-brand text-cyan-400">${l.w}kg x ${l.r}</p>
                                    <p class="text-[8px] text-slate-600 uppercase font-bold">Vol: ${l.w*l.r}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
                setTimeout(initChart, 50);
            } else if (page === 'log') {
                div.innerHTML = `
                    <div class="glass p-8 space-y-6">
                        <h2 class="text-center font-brand font-black text-lg text-white">RECORD PERFORMANCE</h2>
                        <div class="space-y-4">
                            <div>
                                <label class="text-[9px] font-bold text-slate-500 uppercase mb-2 block">Exercise</label>
                                <select id="f-ex" class="w-full bg-slate-800 p-4 rounded-xl text-sm outline-none border-none text-white">
                                    ${Object.keys(TRAINING_PROGRAM).map(cat => 
                                        `<optgroup label="${cat} Day">${TRAINING_PROGRAM[cat].map(e => `<option value="${e.name}">${e.name}</option>`).join('')}</optgroup>`
                                    )}
                                </select>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="text-[9px] font-bold text-slate-500 uppercase mb-2 block">Weight (KG)</label>
                                    <input id="f-w" type="number" placeholder="0.0" class="w-full bg-slate-800 p-4 rounded-xl text-lg font-brand text-cyan-400 outline-none">
                                </div>
                                <div>
                                    <label class="text-[9px] font-bold text-slate-500 uppercase mb-2 block">Total Reps</label>
                                    <input id="f-r" type="number" placeholder="0" class="w-full bg-slate-800 p-4 rounded-xl text-lg font-brand text-white outline-none">
                                </div>
                            </div>
                            <button onclick="save()" class="w-full bg-cyan-500 py-5 rounded-2xl text-slate-950 font-brand font-black text-xs uppercase shadow-lg shadow-cyan-500/20 active:scale-95 transition-transform">Analyze & Save</button>
                        </div>
                    </div>
                `;
            } else if (page === 'guide') {
                div.innerHTML = `<h2 class="text-center font-brand font-black text-white text-sm uppercase tracking-widest mb-6 underline decoration-cyan-500 decoration-2">90-Day Bio-Lab Guide</h2>`;
                Object.keys(TRAINING_PROGRAM).forEach(day => {
                    div.innerHTML += `<h3 class="text-[10px] font-bold text-cyan-400 uppercase mt-6 mb-3 tracking-widest px-2">${day} SESSION</h3>`;
                    TRAINING_PROGRAM[day].forEach(e => {
                        div.innerHTML += `
                            <div class="glass p-5 mb-3 border-l-4 border-white/10 hover:border-cyan-500 transition-all">
                                <div class="flex justify-between items-start mb-2">
                                    <p class="font-bold text-white text-xs">${e.name}</p>
                                    <span class="text-[8px] bg-cyan-500/20 text-cyan-400 px-2 py-0.5 rounded font-black">${e.sets}X${e.reps}</span>
                                </div>
                                <p class="text-[10px] text-slate-400 leading-relaxed">${e.hint}</p>
                            </div>
                        `;
                    });
                });
            }
            runAIAnalysis();
        }

        function save() {
            const n = document.getElementById('f-ex').value, 
                  w = parseFloat(document.getElementById('f-w').value), 
                  r = parseInt(document.getElementById('f-r').value);
            if(!w || !r) return;
            logs.push({n, w, r, id: Date.now()});
            localStorage.setItem('logs', JSON.stringify(logs));
            showPage('home');
        }

        function initChart() {
            const ctx = document.getElementById('chart')?.getContext('2d');
            if(!ctx || logs.length === 0) return;
            const recent = logs.slice(-7);
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: recent.map((_,i) => i+1),
                    datasets: [{
                        data: recent.map(l => l.w * l.r),
                        borderColor: '#22d3ee',
                        borderWidth: 2,
                        tension: 0.4,
                        pointRadius: 3,
                        pointBackgroundColor: '#22d3ee',
                        fill: true,
                        backgroundColor: 'rgba(34, 211, 238, 0.05)'
                    }]
                },
                options: {
                    plugins: { legend: { display: false } },
                    scales: { x: { display: false }, y: { display: false } }
                }
            });
        }

        runAIAnalysis();
        showPage('home');
    </script>
</body>
</html>
