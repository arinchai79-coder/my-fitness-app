<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>90-Day Strict Workout Tracker with AI Analysis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body {
            background-color: #0f172a;
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
        }
        .day-card {
            background-color: #1e293b;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .day-card.completed {
            border-left: 8px solid #22c55e;
            opacity: 0.9;
        }
        .day-card.rest {
            background-color: #111827;
            border-left: 8px solid #64748b;
        }
        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 50;
            background-color: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #334155;
        }
        .coach-tip {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 4px;
            display: block;
            border-left: 2px solid #3b82f6;
            padding-left: 8px;
        }
        .ai-glow {
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.2);
            border: 1px solid rgba(168, 85, 247, 0.4);
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <header class="sticky-header mb-8 pb-4">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-3xl font-black text-blue-500 pt-4 text-center uppercase tracking-tighter">🛡️ 90-DAY STRICT PROGRAM</h1>
            
            <!-- AI Analysis Dashboard -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-6">
                <div class="ai-glow bg-slate-900 p-4 rounded-2xl">
                    <div class="flex items-center gap-2 mb-2">
                        <span class="text-purple-400 text-xl">🧠</span>
                        <h2 class="text-[10px] font-bold uppercase tracking-widest text-purple-400">AI Performance Insight</h2>
                    </div>
                    <p id="ai-status" class="text-sm text-slate-300 font-medium italic">เริ่มต้นการฝึกเพื่อรวบรวมข้อมูลวิเคราะห์...</p>
                </div>
                
                <div class="bg-slate-800/50 p-4 rounded-2xl border border-slate-700">
                    <span class="text-[10px] uppercase tracking-wider block text-slate-400 mb-1 font-bold">Consistency Index</span>
                    <div class="flex items-end gap-2">
                        <span id="progress-percent" class="text-3xl font-black text-green-400 leading-none">0%</span>
                        <span id="completed-count" class="text-xs text-slate-500 pb-1">0/39 days</span>
                    </div>
                </div>

                <div class="bg-slate-800/50 p-4 rounded-2xl border border-slate-700">
                    <span class="text-[10px] uppercase tracking-wider block text-slate-400 mb-1 font-bold">Body Recovery Status</span>
                    <div class="w-full bg-slate-700 h-2 rounded-full mt-2">
                        <div id="recovery-bar" class="bg-blue-500 h-2 rounded-full transition-all duration-1000" style="width: 100%"></div>
                    </div>
                    <span id="recovery-text" class="text-[10px] text-blue-300 mt-1 block">Optimal - กล้ามเนื้อพร้อมรับแรงต้าน</span>
                </div>
            </div>

            <!-- Body Measurement Section -->
            <div class="mt-4 bg-slate-800/30 p-4 rounded-2xl border border-dashed border-slate-600">
                <h3 class="text-xs font-bold text-slate-400 uppercase mb-3 text-center">📊 บันทึกการพัฒนาของร่างกาย (Body Tracking)</h3>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                    <div>
                        <label class="block text-[10px] text-slate-500 uppercase ml-1">น้ำหนัก (kg)</label>
                        <input type="number" id="weight-input" placeholder="0.0" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-500 uppercase ml-1">รอบเอว (inch)</label>
                        <input type="number" id="waist-input" placeholder="0.0" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-500 uppercase ml-1">รอบอก (inch)</label>
                        <input type="number" id="chest-input" placeholder="0.0" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div class="flex items-end">
                        <button onclick="saveBodyStats()" class="w-full bg-slate-700 hover:bg-slate-600 py-2 rounded-lg text-xs font-bold transition">บันทึกสถิติวันนี้</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div id="calendar-container" class="max-w-4xl mx-auto space-y-6 pb-20">
        <!-- Generated by JS -->
    </div>

    <script>
        const workoutPlan = {
            "อังคาร": {
                title: "พละกำลังส่วนบนและขา (Heavy Push & Legs)",
                focus: "Strength",
                exercises: [
                    { name: "Warm-up: เดินลู่วิ่ง 5 นาที", tip: "ความเร็ว 5.0-5.5 ไม่จับราว แกว่งแขนตามธรรมชาติ" },
                    { name: "Chest Press Machine: 4 เซต / 10-12 ครั้ง", tip: "หลังชิดเบาะ ดันออกหายใจออก (ระเบิดพลัง) ผ่อนเข้าหายใจเข้า (ช้าๆ)" },
                    { name: "Dumbbell Goblet Squats: 4 เซต / 12-15 ครั้ง", tip: "ถือดัมเบลชิดอก ทิ้งก้นลงเหมือนนั่งเก้าอี้ อย่าให้เข่าเลยปลายเท้ามากไป" },
                    { name: "Dumbbell Shoulder Press: 3 เซต / 10 ครั้ง", tip: "นั่งหลังตรง ยกเป้าหมายคือให้แขนตึงพอดี ไม่กระชากไหล่" },
                    { name: "Plank: 3 รอบ / รอบละ 60 วินาที", tip: "เกร็งหน้าท้องและก้น ตัวต้องขนานพื้นเหมือนไม้กระดาน" }
                ]
            },
            "พฤหัสบดี": {
                title: "ความอึดและการเผาผลาญ (Cardio Focus)",
                focus: "Endurance",
                exercises: [
                    { name: "Treadmill Incline Walk: 30 นาที", tip: "ชัน 5-8% / เร็ว 4.5-5.5 ห้ามจับราวเด็ดขาด เพื่อการเผาผลาญสูงสุด" },
                    { name: "Dumbbell Row: 4 เซต / 12 ครั้ง (ทีละข้าง)", tip: "โน้มตัวลง หลังตรง ดึงดัมเบลเข้าหาเอว (ไม่ใช่ดึงขึ้นหน้าอก) เน้นใช้กล้ามหลัง" },
                    { name: "Dumbbell Lunges: 3 เซต / ข้างละ 10 ครั้ง", tip: "ก้าวไปข้างหน้า ย่อเข่าทำมุม 90 องศาทั้งสองข้าง รักษาตัวให้ตรง" },
                    { name: "Dumbbell Lateral Raise: 3 เซต / 12 ครั้ง", tip: "ยกดัมเบลออกด้านข้างเพียงระดับไหล่ อย่าเหวี่ยง ใช้แรงจากหัวไหล่เพียวๆ" }
                ]
            },
            "เสาร์": {
                title: "ฝึกรวมและเก็บรายละเอียด (Full Body & Intensity)",
                focus: "Intensity",
                exercises: [
                    { name: "Warm-up: วิ่งลู่วิ่ง 5 นาที", tip: "ความเร็ว 7.0-8.0 เพื่อให้ร่างกายพร้อมรับงานหนัก" },
                    { name: "Chest Press Machine: 3 เซต / 15 ครั้ง", tip: "เน้นการบีบกล้ามเนื้ออกในทุกครั้งที่ดันจนสุด" },
                    { name: "Dumbbell Romanian Deadlift: 3 เซต / 12 ครั้ง", tip: "ดันสะโพกไปด้านหลัง ก้มลงโดยขาเกือบตึง จะรู้สึกตึงมากที่หลังขา" },
                    { name: "Dumbbell Bicep Curls: 3 เซต / 12 ครั้ง", tip: "ล็อกศอกข้างลำตัว อย่าเหวี่ยงตัวช่วยยก" },
                    { name: "Dumbbell Tricep Extension: 3 เซต / 12 ครั้ง", tip: "ถือดัมเบลยกเหนือหัว พับศอกไปด้านหลัง ล็อกต้นแขนให้นิ่ง" },
                    { name: "Treadmill HIIT: วิ่ง 1 นาที / เดิน 1 นาที (5 รอบ)", tip: "วิ่งเต็มสปีด (9.0+) แล้วกลับมาเดินช้า (3.0) สลับกัน" }
                ]
            }
        };

        const daysOfWeek = ["อาทิตย์", "จันทร์", "อังคาร", "พุธ", "พฤหัสบดี", "ศุกร์", "เสาร์"];
        const startDate = new Date();
        const totalDays = 90;
        let completedDays = JSON.parse(localStorage.getItem('completedWorkouts') || "[]");
        let bodyStats = JSON.parse(localStorage.getItem('bodyStats') || "[]");

        function renderCalendar() {
            const container = document.getElementById('calendar-container');
            container.innerHTML = '';
            let totalWorkoutDays = 0;

            for (let i = 0; i < totalDays; i++) {
                const currentDate = new Date(startDate);
                currentDate.setDate(startDate.getDate() + i);
                const dayName = daysOfWeek[currentDate.getDay()];
                const plan = workoutPlan[dayName];
                const dateString = currentDate.toLocaleDateString('th-TH', { day: 'numeric', month: 'short' });
                
                const card = document.createElement('div');
                card.className = `day-card p-6 rounded-2xl shadow-xl ${completedDays.includes(i) ? 'completed' : ''}`;
                
                if (plan) {
                    totalWorkoutDays++;
                    card.innerHTML = `
                        <div class="flex flex-col md:flex-row justify-between md:items-center gap-4 mb-4">
                            <div>
                                <span class="bg-blue-600/30 text-blue-400 text-xs font-bold px-2 py-1 rounded uppercase mb-2 inline-block tracking-widest">Day ${i + 1} - ${dayName}</span>
                                <h3 class="text-xl font-bold text-white">${plan.title}</h3>
                                <p class="text-slate-500 text-xs mt-1 font-medium">${dateString}</p>
                            </div>
                            <button onclick="toggleDay(${i})" class="w-full md:w-auto px-8 py-4 rounded-xl font-black text-sm transition-all ${completedDays.includes(i) ? 'bg-green-600 hover:bg-green-700 shadow-lg shadow-green-900/30' : 'bg-blue-600 hover:bg-blue-700 active:scale-95 shadow-lg shadow-blue-900/30'}">
                                ${completedDays.includes(i) ? '✓ COMPLETED' : 'COMPLETE WORKOUT'}
                            </button>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            ${plan.exercises.map(ex => `
                                <div class="bg-slate-900/40 p-3 rounded-xl border border-slate-800">
                                    <span class="font-semibold text-slate-200 block text-sm">${ex.name}</span>
                                    <span class="coach-tip text-slate-400">💡 Tip: ${ex.tip}</span>
                                </div>
                            `).join('')}
                        </div>
                    `;
                } else {
                    card.classList.add('rest');
                    card.innerHTML = `
                        <div class="flex items-center gap-4 text-slate-600 italic font-medium">
                            <span class="text-xs font-bold tracking-tighter">DAY ${i + 1} - ${dayName} (${dateString})</span>
                            <span class="h-[1px] flex-grow bg-slate-800/50"></span>
                            <span class="text-[10px] uppercase tracking-widest font-black">Recovery Phase 💤</span>
                        </div>
                    `;
                }
                container.appendChild(card);
            }
            updateStats(totalWorkoutDays);
            runAIAnalysis(totalWorkoutDays);
        }

        function saveBodyStats() {
            const weight = document.getElementById('weight-input').value;
            const waist = document.getElementById('waist-input').value;
            const chest = document.getElementById('chest-input').value;
            
            if (!weight && !waist && !chest) return;

            const newStat = {
                date: new Date().toISOString(),
                weight, waist, chest
            };
            
            bodyStats.push(newStat);
            localStorage.setItem('bodyStats', JSON.stringify(bodyStats));
            alert("บันทึกสถิติสำเร็จ! AI จะใช้ข้อมูลนี้วิเคราะห์การพัฒนาของคุณ");
            renderCalendar();
        }

        function runAIAnalysis(totalWorkoutDays) {
            const aiStatus = document.getElementById('ai-status');
            const recoveryBar = document.getElementById('recovery-bar');
            const recoveryText = document.getElementById('recovery-text');
            
            const doneCount = completedDays.length;
            const completionRate = (doneCount / totalWorkoutDays) * 100;

            // Analysis logic based on completed days and body stats
            if (doneCount === 0) {
                aiStatus.innerText = "เตรียมความพร้อม! AI จะเริ่มวิเคราะห์เมื่อคุณจบการฝึกครั้งแรก";
            } else {
                let analysisText = "";
                
                // Strength Analysis
                if (completionRate > 80) {
                    analysisText = "วินัยดีเยี่ยม! ร่างกายกำลังเข้าสู่ช่วง 'Anabolic Phase' (สร้างกล้ามเนื้อ) อย่างเต็มตัว";
                } else if (completionRate > 40) {
                    analysisText = "แนวโน้มเป็นบวก แต่ต้องระวังการขาดฝึกในวัน Cardio เพื่อเร่งการเผาผลาญ";
                } else {
                    analysisText = "วินัยต่ำกว่าเกณฑ์ AI แนะนำให้กลับมาฝึกทันทีเพื่อรักษาฐานกล้ามเนื้อเดิม";
                }

                // Body Stat Analysis
                if (bodyStats.length >= 2) {
                    const latest = bodyStats[bodyStats.length - 1];
                    const previous = bodyStats[bodyStats.length - 2];
                    
                    if (latest.waist < previous.waist) {
                        analysisText += " | ตรวจพบ: รอบเอวลดลง แสดงถึงการเผาผลาญไขมันที่มีประสิทธิภาพ";
                    } else if (latest.weight > previous.weight && doneCount > 5) {
                        analysisText += " | ตรวจพบ: น้ำหนักเพิ่มขึ้นพร้อมวินัยที่สม่ำเสมอ เป็นสัญญาณของการเพิ่มมวลกล้ามเนื้อ";
                    }
                }

                aiStatus.innerText = analysisText;
            }

            // Recovery bar logic
            const dayOfWeek = new Date().getDay(); // 0-6
            const isRestDay = ![2, 4, 6].includes(dayOfWeek);
            
            if (isRestDay) {
                recoveryBar.style.width = "100%";
                recoveryBar.className = "bg-green-500 h-2 rounded-full transition-all duration-1000";
                recoveryText.innerText = "Fully Recovered - ร่างกายซ่อมแซมเสร็จสิ้น";
            } else {
                recoveryBar.style.width = "60%";
                recoveryBar.className = "bg-blue-500 h-2 rounded-full transition-all duration-1000";
                recoveryText.innerText = "Training Mode - กล้ามเนื้อกำลังทำงาน";
            }
        }

        function toggleDay(index) {
            const idx = completedDays.indexOf(index);
            if (idx > -1) completedDays.splice(idx, 1);
            else completedDays.push(index);
            localStorage.setItem('completedWorkouts', JSON.stringify(completedDays));
            renderCalendar();
        }

        function updateStats(totalWorkoutDays) {
            const actualWorkoutsDone = completedDays.length; 
            const percent = totalWorkoutDays > 0 ? Math.round((actualWorkoutsDone / totalWorkoutDays) * 100) : 0;
            document.getElementById('progress-percent').innerText = `${percent}%`;
            document.getElementById('completed-count').innerText = `${actualWorkoutsDone}/${totalWorkoutDays}`;
        }

        renderCalendar();
    </script>
</body>
</html>
