<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>90-Day Strict Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body {
            background-color: #0f172a;
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .safe-area-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .glass-nav {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .active-tab-icon {
            color: #3b82f6;
            transform: translateY(-2px);
        }
        .ios-card {
            background: #1e293b;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        input {
            font-size: 16px !important; /* Prevent iOS zoom on focus */
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- Header Area -->
    <header class="p-5 pb-2">
        <h1 class="text-2xl font-black text-white italic">AERO<span class="text-blue-500">FIT</span> 90</h1>
        <p id="current-date-display" class="text-[10px] text-slate-500 font-bold uppercase tracking-widest"></p>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow px-4 pb-24 overflow-y-auto">
        
        <!-- Tab 1: Dashboard -->
        <section id="tab-home" class="tab-content active space-y-4">
            <div class="ios-card p-5 mt-2 bg-gradient-to-br from-blue-600/20 to-purple-600/20 border-blue-500/20">
                <div class="flex items-center gap-2 mb-3">
                    <span class="text-xl">🧠</span>
                    <h2 class="text-[10px] font-black uppercase tracking-widest text-blue-400">AI Performance Insight</h2>
                </div>
                <p id="ai-status" class="text-sm text-slate-200 font-medium italic leading-relaxed">กำลังเตรียมข้อมูลวิเคราะห์...</p>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="ios-card p-4">
                    <span class="text-[10px] uppercase text-slate-500 font-bold">ความต่อเนื่อง</span>
                    <div class="flex items-baseline gap-1 mt-1">
                        <span id="progress-percent" class="text-2xl font-black text-green-400">0%</span>
                        <span class="text-[10px] text-slate-500">Goal</span>
                    </div>
                </div>
                <div class="ios-card p-4">
                    <span class="text-[10px] uppercase text-slate-500 font-bold">สถานะฟื้นฟู</span>
                    <div id="recovery-text" class="text-xs font-bold text-blue-400 mt-1 uppercase">Ready</div>
                </div>
            </div>

            <div class="ios-card p-5">
                <h3 class="text-xs font-bold text-slate-400 uppercase mb-4">ตารางวันนี้</h3>
                <div id="today-preview" class="space-y-2">
                    <!-- Today's Workout Summary will appear here -->
                </div>
            </div>
        </section>

        <!-- Tab 2: Workout -->
        <section id="tab-workout" class="tab-content space-y-4">
            <div class="flex justify-between items-center mb-2 mt-2">
                <h2 class="text-lg font-bold">โปรแกรมการฝึก</h2>
                <select id="day-selector" onchange="renderSpecificDay()" class="bg-slate-800 text-xs font-bold px-3 py-2 rounded-xl outline-none border border-slate-700">
                    <!-- Options generated by JS -->
                </select>
            </div>
            <div id="selected-day-container" class="space-y-3">
                <!-- Workout details -->
            </div>
        </section>

        <!-- Tab 3: Stats -->
        <section id="tab-stats" class="tab-content space-y-4">
            <div class="ios-card p-5 mt-2">
                <h3 class="text-sm font-bold text-white mb-4">บันทึกสัดส่วนใหม่</h3>
                <div class="space-y-4">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-[10px] text-slate-500 uppercase font-bold ml-1">น้ำหนัก (kg)</label>
                            <input type="number" id="weight-input" placeholder="0.0" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl p-3 text-white outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="text-[10px] text-slate-500 uppercase font-bold ml-1">เอว (inch)</label>
                            <input type="number" id="waist-input" placeholder="0.0" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl p-3 text-white outline-none focus:border-blue-500">
                        </div>
                    </div>
                    <button onclick="saveBodyStats()" class="w-full bg-blue-600 active:bg-blue-700 py-4 rounded-2xl font-black text-xs uppercase tracking-widest shadow-lg shadow-blue-900/40">บันทึกข้อมูลวันนี้</button>
                </div>
            </div>

            <div class="ios-card p-5">
                <h3 class="text-sm font-bold text-white mb-3">ประวัติการพัฒนา</h3>
                <div id="stats-history" class="space-y-3 max-h-60 overflow-y-auto">
                    <!-- Stats history list -->
                </div>
            </div>
        </section>

    </main>

    <!-- Navigation Bar (iOS Style) -->
    <nav class="fixed bottom-0 left-0 right-0 glass-nav safe-area-bottom">
        <div class="max-w-md mx-auto flex justify-around items-center h-16">
            <button onclick="switchTab('home')" class="flex flex-col items-center gap-1 nav-btn active-tab-icon" id="btn-home">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span class="text-[9px] font-bold uppercase">Dashboard</span>
            </button>
            <button onclick="switchTab('workout')" class="flex flex-col items-center gap-1 nav-btn text-slate-500" id="btn-workout">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12"/><path d="M8 7h8"/><path d="M10 11h4"/><path d="M12 15v6"/><path d="M12 3v12"/><path d="m8 21 4-4 4 4"/></svg>
                <span class="text-[9px] font-bold uppercase">Workout</span>
            </button>
            <button onclick="switchTab('stats')" class="flex flex-col items-center gap-1 nav-btn text-slate-500" id="btn-stats">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v-6"/><path d="M6 20V10"/><path d="M18 20V4"/></svg>
                <span class="text-[9px] font-bold uppercase">Stats</span>
            </button>
        </div>
    </nav>

    <script>
        const workoutPlan = {
            "อังคาร": {
                title: "Heavy Push & Legs",
                exercises: [
                    { name: "Warm-up: เดินลู่วิ่ง 5 นาที", tip: "ความเร็ว 5.0-5.5 ไม่จับราว" },
                    { name: "Chest Press Machine", info: "4 เซต / 10-12 ครั้ง", tip: "ดันออกหายใจออก ผ่อนเข้าช้าๆ" },
                    { name: "Dumbbell Goblet Squats", info: "4 เซต / 12-15 ครั้ง", tip: "ถือดัมเบลชิดอก ย่อก้นลงเหมือนนั่งเก้าอี้" },
                    { name: "Dumbbell Shoulder Press", info: "3 เซต / 10 ครั้ง", tip: "หลังตรง ยกให้แขนตึงพอดี" },
                    { name: "Plank", info: "3 รอบ / 60 วินาที", tip: "เกร็งหน้าท้อง ตัวขนานพื้น" }
                ]
            },
            "พฤหัสบดี": {
                title: "Cardio Focus & Pull",
                exercises: [
                    { name: "Treadmill Incline Walk", info: "30 นาที", tip: "ชัน 5-8% / เร็ว 4.5+ ห้ามจับราว" },
                    { name: "Dumbbell Row", info: "4 เซต / 12 ครั้ง", tip: "ดึงดัมเบลเข้าหาเอว เน้นกล้ามหลัง" },
                    { name: "Dumbbell Lunges", info: "3 เซต / ข้างละ 10 ครั้ง", tip: "ย่อเข่า 90 องศา ตัวตั้งตรง" },
                    { name: "Dumbbell Lateral Raise", info: "3 เซต / 12 ครั้ง", tip: "ยกออกข้างลำตัวระดับไหล่" }
                ]
            },
            "เสาร์": {
                title: "Full Body & HIIT",
                exercises: [
                    { name: "Warm-up: วิ่ง 5 นาที", tip: "ความเร็ว 7.0+" },
                    { name: "Chest Press Machine", info: "3 เซต / 15 ครั้ง", tip: "เน้นบีบกล้ามเนื้ออก" },
                    { name: "Dumbbell Romanian Deadlift", info: "3 เซต / 12 ครั้ง", tip: "ดันสะโพกไปหลัง ขาเกือบตึง" },
                    { name: "Dumbbell Bicep Curls", info: "3 เซต / 12 ครั้ง", tip: "ล็อกศอกให้นิ่ง" },
                    { name: "Dumbbell Tricep Extension", info: "3 เซต / 12 ครั้ง", tip: "ยกดัมเบลเหนือหัว พับศอกไปหลัง" },
                    { name: "Treadmill HIIT", info: "วิ่ง 1 นาที / เดิน 1 นาที (5 รอบ)", tip: "วิ่ง 9.0+ / เดิน 3.0" }
                ]
            }
        };

        const daysOfWeek = ["อาทิตย์", "จันทร์", "อังคาร", "พุธ", "พฤหัสบดี", "ศุกร์", "เสาร์"];
        let completedDays = JSON.parse(localStorage.getItem('completedWorkouts') || "[]");
        let bodyStats = JSON.parse(localStorage.getItem('bodyStats') || "[]");

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active-tab-icon', 'text-blue-500'));
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.add('text-slate-500'));

            document.getElementById(`tab-${tabId}`).classList.add('active');
            const activeBtn = document.getElementById(`btn-${tabId}`);
            activeBtn.classList.add('active-tab-icon', 'text-blue-500');
            activeBtn.classList.remove('text-slate-500');
        }

        function initApp() {
            const now = new Date();
            document.getElementById('current-date-display').innerText = now.toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'long' });
            
            // Populate selector
            const selector = document.getElementById('day-selector');
            for (let i = 0; i < 90; i++) {
                const date = new Date();
                date.setDate(date.getDate() + i);
                const dayName = daysOfWeek[date.getDay()];
                const opt = document.createElement('option');
                opt.value = i;
                opt.innerText = `Day ${i + 1} - ${dayName}`;
                selector.appendChild(opt);
            }

            renderDashboard();
            renderSpecificDay();
            renderStatsHistory();
        }

        function renderDashboard() {
            const now = new Date();
            const dayName = daysOfWeek[now.getDay()];
            const plan = workoutPlan[dayName];
            const preview = document.getElementById('today-preview');
            const totalWorkoutDays = 39; // Approximate for 90 days (3 days/week)
            
            const percent = Math.round((completedDays.length / totalWorkoutDays) * 100);
            document.getElementById('progress-percent').innerText = `${percent}%`;

            if (plan) {
                preview.innerHTML = `
                    <div class="text-blue-400 font-bold text-sm mb-1">${plan.title}</div>
                    <p class="text-[10px] text-slate-500 mb-3 italic">เริ่มเล่นเวลา 20.30 น. ตามที่คุณวางแผนไว้</p>
                    <button onclick="switchTab('workout')" class="text-[10px] font-bold text-blue-500 uppercase border border-blue-500/30 px-3 py-1 rounded-full">ดูรายการฝึกทั้งหมด</button>
                `;
                document.getElementById('recovery-text').innerText = "Training Day";
                document.getElementById('recovery-text').className = "text-xs font-bold text-orange-400 mt-1 uppercase";
            } else {
                preview.innerHTML = `<p class="text-xs text-slate-500 italic">วันนี้เป็นวันพักผ่อน เน้นการยืดเหยียดและนอนให้เต็มอิ่ม</p>`;
                document.getElementById('recovery-text').innerText = "Recovery";
                document.getElementById('recovery-text').className = "text-xs font-bold text-green-400 mt-1 uppercase";
            }

            updateAIInsight();
        }

        function renderSpecificDay() {
            const index = parseInt(document.getElementById('day-selector').value);
            const container = document.getElementById('selected-day-container');
            const date = new Date();
            date.setDate(date.getDate() + index);
            const dayName = daysOfWeek[date.getDay()];
            const plan = workoutPlan[dayName];

            if (plan) {
                container.innerHTML = `
                    <div class="ios-card p-5 border-l-4 border-blue-500">
                        <h3 class="font-black text-white text-lg">${plan.title}</h3>
                        <p class="text-[10px] text-slate-500 uppercase mt-1">Day ${index + 1} • ${dayName}</p>
                    </div>
                    ${plan.exercises.map(ex => `
                        <div class="ios-card p-4 flex justify-between items-center">
                            <div class="flex-grow">
                                <span class="text-sm font-bold text-slate-200 block">${ex.name}</span>
                                <span class="text-[10px] text-blue-400 font-bold">${ex.info || ''}</span>
                                <span class="block text-[10px] text-slate-500 italic mt-1">💡 ${ex.tip}</span>
                            </div>
                        </div>
                    `).join('')}
                    <button onclick="toggleDay(${index})" class="w-full py-5 rounded-2xl font-black text-xs uppercase tracking-widest transition-all ${completedDays.includes(index) ? 'bg-green-600' : 'bg-blue-600 shadow-lg shadow-blue-900/40'}">
                        ${completedDays.includes(index) ? '✓ บันทึกสำเร็จ' : 'ยืนยันการฝึกเสร็จสิ้น'}
                    </button>
                `;
            } else {
                container.innerHTML = `
                    <div class="ios-card p-10 text-center opacity-60">
                        <span class="text-4xl mb-4 block">💤</span>
                        <h3 class="font-bold text-slate-400">วันพักผ่อน (Rest Day)</h3>
                        <p class="text-xs text-slate-600 mt-2 italic">ปล่อยให้กล้ามเนื้อได้ซ่อมแซมตัวเอง</p>
                    </div>
                `;
            }
        }

        function toggleDay(index) {
            const idx = completedDays.indexOf(index);
            if (idx > -1) completedDays.splice(idx, 1);
            else completedDays.push(index);
            localStorage.setItem('completedWorkouts', JSON.stringify(completedDays));
            renderSpecificDay();
            renderDashboard();
        }

        function saveBodyStats() {
            const weight = document.getElementById('weight-input').value;
            const waist = document.getElementById('waist-input').value;
            if (!weight && !waist) return;

            bodyStats.unshift({
                date: new Date().toLocaleDateString('th-TH'),
                weight, waist
            });
            localStorage.setItem('bodyStats', JSON.stringify(bodyStats));
            renderStatsHistory();
            updateAIInsight();
            document.getElementById('weight-input').value = '';
            document.getElementById('waist-input').value = '';
        }

        function renderStatsHistory() {
            const container = document.getElementById('stats-history');
            if (bodyStats.length === 0) {
                container.innerHTML = `<p class="text-[10px] text-slate-600 italic text-center py-4">ยังไม่มีข้อมูลบันทึก</p>`;
                return;
            }
            container.innerHTML = bodyStats.map(s => `
                <div class="flex justify-between items-center bg-slate-900/40 p-3 rounded-xl border border-slate-800">
                    <span class="text-[10px] font-bold text-slate-500">${s.date}</span>
                    <div class="flex gap-4">
                        <span class="text-xs font-bold text-white">${s.weight} kg</span>
                        <span class="text-xs font-bold text-blue-400">${s.waist}"</span>
                    </div>
                </div>
            `).join('');
        }

        function updateAIInsight() {
            const ai = document.getElementById('ai-status');
            if (completedDays.length === 0) {
                ai.innerText = "เริ่มฝึกครั้งแรกคืนนี้เวลา 20.30 น. เพื่อให้ระบบเริ่มวิเคราะห์ร่างกายของคุณครับ";
                return;
            }
            
            let message = "คุณรักษาความสม่ำเสมอได้ดี!";
            if (bodyStats.length >= 2) {
                if (parseFloat(bodyStats[0].waist) < parseFloat(bodyStats[1].waist)) {
                    message = "เยี่ยมมาก! รอบเอวลดลงชัดเจน แสดงว่าการ Cardio 30 นาทีได้ผล";
                }
            }
            ai.innerText = message;
        }

        window.onload = initApp;
    </script>
</body>
</html>
